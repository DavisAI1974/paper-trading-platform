name: Verify paper platform on purchased MBO
on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MARKETS_DATA: ${{ github.workspace }}/purchased-inputs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DavisAI1974/markets-data
          ref: 46199c5f4af03fde341535a7aff6a0396300cc73
          path: purchased-inputs
          persist-credentials: false
          sparse-checkout: data/nymex_mbo/ng_v0_oct2023
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r paper_platform/requirements.txt pytest httpx
      - name: Verify the calendar, strategy rules, journal and dashboard
        run: python -m pytest -q -p no:cacheprovider paper_platform tests/root/test_calendar.py
      - name: Verify cutoff parity on each ROOT research trade day
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import os, time
          from paper_platform.causal_gate import check_prefix
          from paper_platform.feed import HistoricalFeed
          from paper_platform.rulebook import catalogue
          from paper_platform.session import LIMIT_SECONDS
          from root.tape import BUILT_TRADE_DAYS
          folder = Path(os.environ["MARKETS_DATA"]) / "data/nymex_mbo/ng_v0_oct2023"
          for trade_day in sorted(BUILT_TRADE_DAYS):
              result = check_prefix(HistoricalFeed(folder, trade_day), catalogue(), time.monotonic() + LIMIT_SECONDS)
              print(f"Trade day {trade_day}: {result['status']}, source cursor {result['cutoff']['cursor']}", flush=True)
          PY
