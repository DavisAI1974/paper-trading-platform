name: Live NG MBO paper session
on:
  workflow_dispatch:
    inputs:
      greg_go:
        description: Greg authorizes this capture
        type: boolean
        default: false
      execution_plan:
        description: Committed agent plan filename or inline execution plan JSON
        type: string
        required: true
      event_budget:
        description: Maximum ordinary journal events
        required: true
        type: string
      trade_day:
        description: Named Eastern trade day (YYYY-MM-DD)
        required: true
        type: string
      message_budget:
        description: Maximum deliveries including recovery replay
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ng-capture-live
  cancel-in-progress: false
jobs:
  record:
    if: ${{ inputs.greg_go && github.actor == 'DavisAI1974' && github.triggering_actor == 'DavisAI1974' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 365
    env:
      TRADE_DAY: ${{ inputs.trade_day }}
      SOURCE: live
      EVENT_BUDGET: ${{ inputs.event_budget }}
      DELIVERY_BUDGET: ${{ inputs.message_budget }}
      PAPER_CAPTURE_KEY: ${{ secrets.PAPER_CAPTURE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DavisAI1974/markets-data
          path: checkpoint
          ssh-key: ${{ secrets.MARKETS_DATA_DEPLOY_KEY }}
          sparse-checkout: paper-trading/capture-backup
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DavisAI1974/markets-data
          ref: 46199c5f4af03fde341535a7aff6a0396300cc73
          path: purchased-inputs
          ssh-key: ${{ secrets.MARKETS_DATA_DEPLOY_KEY }}
          sparse-checkout: data/nymex_mbo/ng_v0_oct2023
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r paper_platform/requirements.txt
      - name: Restore the last published capture checkpoint
        id: restore_capture
        run: python -m paper_platform.capture_backup restore --data purchased-inputs --checkout checkpoint --trade-day "$TRADE_DAY" --source "$SOURCE"
      - name: Run the recorder and paper session together
        env:
          EXECUTION_PLAN: ${{ inputs.execution_plan }}
          PAPER_RELAY_URL: ${{ vars.PAPER_RELAY_URL }}
          PAPER_RELAY_TOKEN: ${{ secrets.PAPER_RELAY_TOKEN }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          python -m paper_platform.capture_backup follow --data purchased-inputs --checkout checkpoint --trade-day "$TRADE_DAY" --source "$SOURCE" &
          backup_pid=$!
          python -m paper_platform.record_mbo --data purchased-inputs --trade-day "$TRADE_DAY" --source "$SOURCE" --message-budget "$DELIVERY_BUDGET" --greg-go &
          recorder_pid=$!
          trap 'kill -TERM "$recorder_pid" "${paper_pid:-}" 2>/dev/null || true' INT TERM EXIT
          db=$(python -c 'import os; from datetime import date; from root.calendar import week_sunday; print("purchased-inputs/paper-trading/captures/nymex-ng/"+str(week_sunday(date.fromisoformat(os.environ["TRADE_DAY"])))+"/live.sqlite")')
          # Wait for this workflow's writer, including when an older checkpoint was restored.
          python - "$db" "$recorder_pid" <<'PY'
          import os, sqlite3, sys, time
          from pathlib import Path
          from contextlib import closing
          path = Path(sys.argv[1]).resolve()
          while True:
              os.kill(int(sys.argv[2]), 0)
              if path.exists():
                  with closing(sqlite3.connect(path.as_uri() + "?mode=ro", uri=True)) as db:
                      try:
                          row = db.execute("SELECT status FROM connections ORDER BY id DESC LIMIT 1").fetchone()
                      except sqlite3.OperationalError:
                          row = None
                      if row and row[0] == "recording":
                          break
              time.sleep(0.2)
          PY
          python -m paper_platform.run --greg-go --data purchased-inputs --trade-day "$TRADE_DAY" --market nymex-ng --message-budget "$DELIVERY_BUDGET" --event-budget "$EVENT_BUDGET" --agent-plan "$EXECUTION_PLAN" --capture "$db" &
          paper_pid=$!
          set +e
          wait -n -p finished "$paper_pid" "$recorder_pid" "$backup_pid"
          result=$?
          if [[ "${finished:-}" == "$backup_pid" ]]; then result=1; fi
          if [[ "${finished:-}" != "$paper_pid" ]]; then
            kill -TERM "$paper_pid" 2>/dev/null
            wait "$paper_pid" || result=1
          fi
          kill -TERM "$recorder_pid" 2>/dev/null
          if [[ "${finished:-}" != "$recorder_pid" ]]; then wait "$recorder_pid" || result=1; fi
          kill "$backup_pid" 2>/dev/null
          wait "$backup_pid" 2>/dev/null
          trap - INT TERM EXIT
          exit "$result"
      - name: Persist the final committed deliveries
        if: ${{ always() && steps.restore_capture.outcome == 'success' }}
        run: python -m paper_platform.capture_backup publish --data purchased-inputs --checkout checkpoint --trade-day "$TRADE_DAY" --source "$SOURCE"
