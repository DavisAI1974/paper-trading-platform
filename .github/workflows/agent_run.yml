name: Budgeted agent run
on:
  workflow_dispatch:
    inputs:
      greg_go:
        description: Greg authorizes this agent run
        type: boolean
        default: false
      brief:
        description: Brief file in the platform repository
        required: true
        type: string
      attachments:
        description: Files the brief names, separated by spaces
        required: false
        type: string
      model:
        description: Model identifier
        required: true
        type: string
      output_reserve:
        description: Largest answer in tokens, reserved against the token budget
        required: true
        type: string
      token_budget:
        description: Token budget for the run, input and output together
        required: true
        type: string
      seconds_budget:
        description: Clock budget for the run in seconds
        required: true
        type: string
permissions:
  contents: read
jobs:
  agent:
    if: ${{ inputs.greg_go && github.actor == 'DavisAI1974' && github.triggering_actor == 'DavisAI1974' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Read the selected platform commit
        shell: bash
        run: |
          git init --quiet .
          git remote add origin https://github.com/DavisAI1974/paper-trading-platform.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - uses: ./.github/actions/markets-data
        with:
          path: agent-output
          paths: paper-trading/agent-runs
          deploy-key: ${{ secrets.MARKETS_DATA_DEPLOY_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r paper_platform/requirements-agents.txt
      - name: Run the agent under its budget
        env:
          BRIEF: ${{ inputs.brief }}
          ATTACHMENTS: ${{ inputs.attachments }}
          MODEL: ${{ inputs.model }}
          OUTPUT_RESERVE: ${{ inputs.output_reserve }}
          TOKEN_BUDGET: ${{ inputs.token_budget }}
          SECONDS_BUDGET: ${{ inputs.seconds_budget }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          read -r -a paths <<< "$ATTACHMENTS"
          attach_args=()
          for path in "${paths[@]}"; do
            attach_args+=(--attach "$path")
          done
          run_id=$(python -c 'import uuid; print(uuid.uuid4().hex)')
          exec python -m paper_platform.agent_launcher --data agent-output --run "$run_id" --brief "$BRIEF" "${attach_args[@]}" --model "$MODEL" --output-reserve "$OUTPUT_RESERVE" --token-budget "$TOKEN_BUDGET" --seconds-budget "$SECONDS_BUDGET" --greg-go
