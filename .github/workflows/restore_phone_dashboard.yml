name: Restore phone dashboard from a published run
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed paper run ID in markets-data
        required: true
        type: string
permissions:
  contents: read
jobs:
  restore:
    if: ${{ github.actor == 'DavisAI1974' && github.triggering_actor == 'DavisAI1974' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPER_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Select the recorded run
        shell: bash
        run: '[[ "$PAPER_RUN_ID" =~ ^[0-9a-f]{32}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DavisAI1974/markets-data
          ref: refs/heads/paper-runs/${{ inputs.run_id }}
          path: published-data
          sparse-checkout: paper-trading/${{ inputs.run_id }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r paper_platform/requirements-viewer.txt 'requests>=2.32.4,<3'
      - name: Restore the Render read model
        env:
          PAPER_RELAY_URL: ${{ vars.PAPER_RELAY_URL }}
          PAPER_RELAY_TOKEN: ${{ secrets.PAPER_RELAY_TOKEN }}
        run: python -m paper_platform.restore_view --data published-data --run "$PAPER_RUN_ID"
