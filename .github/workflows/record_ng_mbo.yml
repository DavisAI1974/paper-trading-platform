name: Record NG MBO and persist checkpoints
on:
  workflow_dispatch:
    inputs:
      greg_go:
        description: Greg authorizes this capture
        type: boolean
        default: false
      source:
        description: Capture input
        type: choice
        options: [purchased, live]
      trade_day:
        description: Named Eastern trade day (YYYY-MM-DD)
        required: true
        type: string
      message_budget:
        description: Maximum deliveries including recovery replay
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ng-capture-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  record:
    if: ${{ inputs.greg_go && github.actor == 'DavisAI1974' && github.triggering_actor == 'DavisAI1974' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 365
    env:
      TRADE_DAY: ${{ inputs.trade_day }}
      SOURCE: ${{ inputs.source }}
      DELIVERY_BUDGET: ${{ inputs.message_budget }}
    steps:
      - name: Start the 5.75-hour run clock
        run: python3 -c 'import time; print(f"PAPER_RUN_STARTED_NS={time.monotonic_ns()}")' >> "$GITHUB_ENV"
      - name: Read the selected platform commit
        shell: bash
        run: |
          git init --quiet .
          git remote add origin https://github.com/DavisAI1974/paper-trading-platform.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - uses: ./.github/actions/markets-data
        with:
          path: checkpoint
          paths: paper-trading/capture-backup
          deploy-key: ${{ secrets.MARKETS_DATA_DEPLOY_KEY }}
      - uses: ./.github/actions/markets-data
        with:
          path: purchased-inputs
          ref: 46199c5f4af03fde341535a7aff6a0396300cc73
          paths: data/nymex_mbo/ng_v0_oct2023
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r paper_platform/requirements.txt
      - name: Restore the last published capture checkpoint
        id: restore_capture
        env:
          PAPER_CAPTURE_KEY: ${{ secrets.PAPER_CAPTURE_KEY }}
        run: python -m paper_platform.capture_backup restore --data purchased-inputs --checkout checkpoint --trade-day "$TRADE_DAY" --source "$SOURCE"
      - name: Record deliveries and checkpoint each minute
        env:
          PAPER_CAPTURE_KEY: ${{ secrets.PAPER_CAPTURE_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          env -u DATABENTO_API_KEY -u PUSHOVER_APP_TOKEN -u PUSHOVER_USER_KEY python -m paper_platform.capture_backup follow --data purchased-inputs --checkout checkpoint --trade-day "$TRADE_DAY" --source "$SOURCE" &
          backup_pid=$!
          env -u PAPER_CAPTURE_KEY -u SSH_AUTH_SOCK python -m paper_platform.record_mbo --data purchased-inputs --trade-day "$TRADE_DAY" --source "$SOURCE" --message-budget "$DELIVERY_BUDGET" --greg-go &
          recorder_pid=$!
          trap 'kill -TERM "$recorder_pid" 2>/dev/null || true' INT TERM
          set +e
          wait -n -p finished "$recorder_pid" "$backup_pid"
          result=$?
          if [[ "${finished:-}" != "$recorder_pid" ]]; then
            # The recorder reports SIGUSR1 as a failed checkpoint publication and SIGTERM as a stop.
            if [[ "${finished:-}" == "$backup_pid" ]]; then kill -USR1 "$recorder_pid" 2>/dev/null; else kill -TERM "$recorder_pid" 2>/dev/null; fi
            wait "$recorder_pid"
            result=1
          fi
          kill "$backup_pid" 2>/dev/null
          wait "$backup_pid" 2>/dev/null
          exit "$result"
      - name: Persist the final committed deliveries
        if: ${{ always() && steps.restore_capture.outcome == 'success' }}
        env:
          PAPER_CAPTURE_KEY: ${{ secrets.PAPER_CAPTURE_KEY }}
        run: python -m paper_platform.capture_backup publish --data purchased-inputs --checkout checkpoint --trade-day "$TRADE_DAY" --source "$SOURCE"
