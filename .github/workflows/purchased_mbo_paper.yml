name: Purchased NG MBO paper replay
on:
  workflow_dispatch:
    inputs:
      greg_go:
        description: Start this paper session
        type: boolean
        required: true
        default: false
      trade_day:
        description: Named Eastern trade day (YYYY-MM-DD)
        required: true
        type: string
      tape:
        description: Stored MBO input from markets-data
        type: choice
        options: [purchased-archive, purchased-capture, live-capture]
        default: purchased-archive
      original_run:
        description: For live-capture only, replay the window and agent plan of this published run
        required: false
        type: string
      execution_plan:
        description: Agent plan filename or JSON, required unless replaying an original run
        type: string
        required: false
      market:
        description: Registered instrument profile
        required: true
        type: string
        default: nymex-ng
      message_budget:
        description: Maximum source messages, including Sunday seating records
        required: true
        type: string
      event_budget:
        description: Maximum ordinary journal events
        required: true
        type: string
      stop_after_minutes:
        description: For a short test, stop this many minutes after the first paced record. Empty for a full run
        type: string
        required: false
      phone_page:
        description: Send the events to the phone page. Uncheck to run with the git record and the phone notices only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  paper:
    if: ${{ inputs.greg_go && github.actor == 'DavisAI1974' && github.triggering_actor == 'DavisAI1974' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 365
    env:
      PLATFORM_ROOT: ${{ github.workspace }}
    steps:
      - name: Start the 5.75-hour run clock
        run: python3 -c 'import time; print(f"PAPER_RUN_STARTED_NS={time.monotonic_ns()}")' >> "$GITHUB_ENV"
      - name: Read the selected platform commit
        shell: bash
        run: |
          git init --quiet .
          git remote add origin https://github.com/DavisAI1974/paper-trading-platform.git
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - uses: ./.github/actions/markets-data
        with:
          path: purchased-inputs
          ref: 46199c5f4af03fde341535a7aff6a0396300cc73
          paths: |
            data/nymex_mbo/ng_v0_oct2023
            paper-trading
          deploy-key: ${{ secrets.MARKETS_DATA_DEPLOY_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Select the replay instructions
        env:
          RUN_ID: ${{ inputs.original_run }}
          TAPE: ${{ inputs.tape }}
          PLAN: ${{ inputs.execution_plan }}
        run: |
          if [[ -n "$RUN_ID" ]]; then
            [[ "$TAPE" == live-capture && "$RUN_ID" =~ ^[0-9a-f]{32}$ && -z "$PLAN" ]]
          else
            [[ -n "$PLAN" ]]
          fi
      - if: inputs.original_run != ''
        uses: ./.github/actions/markets-data
        with:
          path: original-journal
          ref: refs/heads/paper-runs/${{ inputs.original_run }}
          paths: paper-trading/${{ inputs.original_run }}
      - name: Use the original platform revision
        if: inputs.original_run != ''
        env:
          RUN_ID: ${{ inputs.original_run }}
        run: |
          receipt="$GITHUB_WORKSPACE/original-journal/paper-trading/$RUN_ID/receipt.json"
          revision=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["code_commit"])' "$receipt")
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$revision" "$GITHUB_SHA"; then
            echo "The selected platform ref must contain the original run commit." >&2
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/original-platform" "$revision"
          echo "PLATFORM_ROOT=$RUNNER_TEMP/original-platform" >> "$GITHUB_ENV"
      - name: Install the selected platform requirements
        run: python -m pip install -r "$PLATFORM_ROOT/paper_platform/requirements.txt"
      - if: inputs.tape == 'purchased-capture' || inputs.tape == 'live-capture'
        uses: ./.github/actions/markets-data
        with:
          path: recorded-checkpoint
          paths: paper-trading/capture-backup
      - name: Restore the recorded week
        if: inputs.tape == 'purchased-capture' || inputs.tape == 'live-capture'
        env:
          TRADE_DAY: ${{ inputs.trade_day }}
          TAPE: ${{ inputs.tape }}
          PAPER_CAPTURE_KEY: ${{ secrets.PAPER_CAPTURE_KEY }}
        run: |
          cd "$PLATFORM_ROOT"
          capture=$(python -m paper_platform.capture_backup restore-recording --data "$GITHUB_WORKSPACE/purchased-inputs" --checkout "$GITHUB_WORKSPACE/recorded-checkpoint" --trade-day "$TRADE_DAY" --source "${TAPE%-capture}")
          echo "RECORDED_CAPTURE=$capture" >> "$GITHUB_ENV"
          echo "CAPTURE_COMMIT=$(git -C "$GITHUB_WORKSPACE/recorded-checkpoint" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Replay the selected stored tape
        env:
          ORIGINAL_RUN: ${{ inputs.original_run }}
          TRADE_DAY: ${{ inputs.trade_day }}
          EXECUTION_PLAN: ${{ inputs.execution_plan }}
          MARKET: ${{ inputs.market }}
          MESSAGE_BUDGET: ${{ inputs.message_budget }}
          EVENT_BUDGET: ${{ inputs.event_budget }}
          PHONE_PAGE: ${{ inputs.phone_page }}
          STOP_AFTER_MINUTES: ${{ inputs.stop_after_minutes }}
          MARKETS_DATA_TOKEN: ${{ secrets.MARKETS_DATA_TOKEN }}
          PAPER_RELAY_URL: ${{ vars.PAPER_RELAY_URL }}
          PAPER_RELAY_TOKEN: ${{ secrets.PAPER_RELAY_TOKEN }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          cd "$PLATFORM_ROOT"
          capture_args=()
          if [[ -n "${RECORDED_CAPTURE:-}" ]]; then
            capture_args=(--replay-capture "$RECORDED_CAPTURE" --capture-commit "$CAPTURE_COMMIT")
          fi
          plan_args=(--agent-plan "$EXECUTION_PLAN")
          if [[ -n "$ORIGINAL_RUN" ]]; then
            plan_args=(--replay-receipt "$GITHUB_WORKSPACE/original-journal/paper-trading/$ORIGINAL_RUN/receipt.json")
          fi
          # A receipt replay runs the earlier commit's code, which has no such switch.
          if [[ "$PHONE_PAGE" == false && -z "$ORIGINAL_RUN" ]]; then
            plan_args+=(--no-phone-page)
          fi
          if [[ -n "$STOP_AFTER_MINUTES" && -z "$ORIGINAL_RUN" ]]; then
            plan_args+=(--stop-after-minutes "$STOP_AFTER_MINUTES")
          fi
          exec python -B -m paper_platform.run "${capture_args[@]}" "${plan_args[@]}" --greg-go --data "$GITHUB_WORKSPACE/purchased-inputs" --market "$MARKET" --trade-day "$TRADE_DAY" --message-budget "$MESSAGE_BUDGET" --event-budget "$EVENT_BUDGET"
